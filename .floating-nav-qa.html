<!doctype html><html><head><meta charset="utf-8"><title>Floating navigation verification</title><style>body{margin:24px;font:15px/1.5 system-ui;background:#eff3ea;color:#162c26}#results{white-space:pre-wrap;width:54%}#preview{position:fixed;right:20px;top:50px;width:40vw;height:85vh;overflow:hidden;border:1px solid #99aa99}iframe{display:block;position:absolute;inset:0;border:0;transform-origin:top left}</style></head><body><h1>Floating navigation verification</h1><p id="status">Running…</p><pre id="results"></pre><div id="preview"></div><script type="module">
let count=0;const results=[];const check=(value,message)=>{count++;if(!value)throw Error(message)};const status=document.querySelector('#status'), output=document.querySelector('#results'), preview=document.querySelector('#preview');const raf=w=>new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)))
async function load(width,height){preview.replaceChildren();const frame=document.createElement('iframe');frame.width=width;frame.height=height;frame.style.transform=`scale(${Math.min(preview.clientWidth/width,preview.clientHeight/height)})`;frame.title=`Navigation ${width} by ${height}`;const ready=new Promise(resolve=>frame.onload=resolve);frame.src='/?navigation-verification='+width;preview.append(frame);await ready;await frame.contentDocument.fonts.ready;await raf(frame.contentWindow);return {win:frame.contentWindow,doc:frame.contentDocument}}
try {
for(const [width,height] of [[320,568],[390,844],[768,1024],[1024,768],[1440,900]]){
 const {win,doc}=await load(width,height),nav=doc.querySelector('.floating-nav'),links=[...nav.querySelectorAll('a')],world=doc.querySelector('.world-scroll-container');const rect=()=>nav.getBoundingClientRect();const start=rect();
 check(links.length===5,`${width}: five links`);check(links.map(a=>a.textContent.trim().replace('↗','').trim()).join(',')==='Register,About,Tracks,Schedule,Sponsors',`${width}: correct labels`);check(links[0].href==='https://tally.so/r/WJJjpe'&&links[0].target==='_blank'&&links[0].rel.includes('noopener'),`${width}: registration opens safely in new tab`)
 check(win.getComputedStyle(nav).position==='fixed',`${width}: fixed positioning`);check(start.left>=0&&start.right<=width&&start.top>=0&&start.bottom<=height,`${width}: all navigation within viewport`);check(doc.documentElement.scrollWidth<=width,`${width}: no horizontal overflow`);check(links.every(a=>a.getBoundingClientRect().height>=44),`${width}: all touch targets at least 44px`);check(links.every(a=>a.scrollWidth<=a.clientWidth+1),`${width}: no clipped labels`)
 const originalHeight=world.offsetHeight;for(const a of links.slice(1)){const id=a.dataset.navSection,target=doc.getElementById(id);a.click();check(win.location.hash==='#'+id&&doc.activeElement===target,`${width}: ${id} hash and keyboard focus`);win.scrollTo({top:target.offsetTop,behavior:'instant'});await raf(win);check(a.getAttribute('aria-current')==='location'&&a.classList.contains('is-highlighted'),`${width}: ${id} active red selection`);check(Math.abs(rect().top-start.top)<1&&Math.abs(rect().left-start.left)<1,`${width}: navigation does not move while scrolling`)}
 check(world.offsetHeight===originalHeight,`${width}: landscape height unchanged`);results.push(`PASS ${width} × ${height}: links, fixed position, scroll, active section, touch targets, overflow`);output.textContent=results.join('\n');status.textContent=`Running: ${count} assertions passed`
}
await load(320,568);status.textContent=`ALL CHECKS PASSED — ${count} assertions`;output.textContent=results.join('\n')
}catch(error){status.textContent='FAILED: '+error.message;output.textContent=results.join('\n')+'\n'+error.stack}
</script></body></html>
